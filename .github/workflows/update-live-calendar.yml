name: Publish live game-developer recruitment calendar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-live-calendar.yml'
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'config.yaml'
      - 'industry_registry.yaml'
      - 'requirements.txt'
      - 'site/index.html'
      - 'site/dashboard.js'
      - 'site/style.css'
  schedule:
    # UTC: 23:12 / 04:12 / 11:12 = KST 08:12 / 13:12 / 20:12.
    # NOT a guaranteed exact-time service. GitHub may delay/drop runs.
    - cron: '12 4,11,23 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: korean-gamedev-live
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Each queued run starts from the latest saved state on main.
          ref: main
      - name: Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install bounded public-page renderer
        run: python -m playwright install --with-deps chromium
      - name: Unit and simulated integration tests
        run: python -m pytest -q
      - name: Scan public and optionally approved API sources
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          SARAMIN_ACCESS_KEY: ${{ secrets.SARAMIN_ACCESS_KEY }}
        run: python -m src.monitor
      - name: Validate generated feed and state
        run: python tools/validate_output.py .
      - name: Explain actual collection coverage
        run: python tools/write_job_summary.py
      - name: Save state and latest feed (no private data)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json site/*.ics site/jobs.json site/health.json site/source_catalog.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public vacancy feed [skip ci]'
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 1
  deploy:
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy
        id: publish
        uses: actions/deploy-pages@v4
